[package]
name = "core"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "onod"
path = "src/main.rs"

[dependencies]
rayon = "1.12"
unicode-normalization = "0.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
log = "0.4"
pdf_oxide = "0.3"
ndarray = "0.17"
tokenizers = "0.21"
ort = "2.0.0-rc.13"
libc = "0.2"
